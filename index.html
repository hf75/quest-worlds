<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quest Worlds</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; color: #d9dde6; overflow: hidden;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      canvas { display: block; position: fixed; inset: 0; touch-action: none; }
      #overlay { position: fixed; z-index: 1; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
        padding: 18px 20px; border-radius: 14px; background: rgba(10, 12, 18, .72); backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, .09); text-align: center; }
      #overlay.hidden { display: none; }
      #overlay.choosing { bottom: auto; top: 50%; transform: translate(-50%, -50%); }
      #overlay.choosing #status, #overlay.choosing #enter { display: none; }
      #overlay h1 { margin: 2px 0 14px; font-size: 19px; font-weight: 600; color: #e9ebf0; }
      #overlay:not(.choosing) h1 { display: none; }
      #planets { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 0 0 14px; }
      #planets:empty { display: none; }
      .planet { flex: 1 1 200px; max-width: 250px; padding: 0; overflow: hidden; text-align: left; font-weight: 400; color: #d9dde6; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .12); }
      .planet img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #14161c; }
      .planet b { display: block; padding: 9px 12px 0; font-size: 16px; font-weight: 600; color: #f0f1f4; }
      .planet span { display: block; padding: 2px 12px 11px; font-size: 13px; line-height: 1.35; color: #a7aebc; }
      .planet[aria-pressed="true"] { border-color: #e6dcc8; box-shadow: 0 0 0 1px #e6dcc8; }
      #status { margin: 0 0 12px; font-size: 15px; color: #aab1bf; }
      button { font: inherit; font-weight: 600; padding: 11px 26px; border-radius: 10px; border: 0; cursor: pointer;
        background: #e6dcc8; color: #16171c; }
      button:disabled { opacity: .4; cursor: default; }
      #trace { margin: 12px 0 0; font: 11px/1.35 ui-monospace, Consolas, monospace; color: #7f8796; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
      #trace:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>Where to?</h1>
      <div id="planets"></div>
      <p id="status">Loading …</p>
      <button id="enter" disabled>Enter VR</button>
      <pre id="trace"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
